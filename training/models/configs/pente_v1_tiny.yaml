# Even smaller than pente_v1_small (32ch/2rb) — same bootstrap data, same
# idea: how small can the architecture go before it stops learning anything
# useful? Useful as a fast/cheap sanity-check model and as a lower bound in
# the architecture-size comparison.

name: pente_v1_tiny

bootstrap: pente_base

model:
  channels: 16
  res_blocks: 1

train:
  batch_size: 256
  learning_rate: 0.01
  weight_decay: 0.0001
  value_loss_weight: 1.0
  value_alpha: 0.2
  val_fraction: 0.05
  val_gate_tolerance: 1.02
  min_grad_steps: 200

bootstrap_training:
  max_cycles: 20
  patience: 3

self_play:
  games_per_round: 30
  simulations: 400
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  exploration_dropoff: 8
  rounds: 10
