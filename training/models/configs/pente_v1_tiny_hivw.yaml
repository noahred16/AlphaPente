# Diagnostic variant of pente_v1_tiny (16ch/1rb): pente_v1_tiny's value-sign
# benchmark score collapsed to ~35-50% (coin-flip or worse) by cycle 5 and
# never recovered, while its open-three (policy) score stayed ~100% the
# whole time. Hypothesis: with value_loss_weight=1.0, the much
# larger-magnitude policy loss (categorical cross-entropy over 361 classes,
# baseline ~5.89) dominates the combined gradient over value loss (MSE on a
# single scalar, far smaller magnitude) — a bigger model has enough spare
# capacity to fit both objectives regardless, but a 16ch/1rb model might get
# "starved" on the value branch. This variant is identical except
# value_loss_weight is bumped 5x, to see if rebalancing the two loss terms'
# gradient contributions fixes it. If not, next step is a depth variant
# (res_blocks=2 at the same width) to isolate capacity from weighting.

name: pente_v1_tiny_hivw

bootstrap: pente_base

model:
  channels: 16
  res_blocks: 1

train:
  batch_size: 256
  learning_rate: 0.01
  weight_decay: 0.0001
  value_loss_weight: 5.0   # was 1.0 in pente_v1_tiny — the one change under test
  value_alpha: 0.2
  val_fraction: 0.05
  val_gate_tolerance: 1.02
  min_grad_steps: 200

bootstrap_training:
  max_cycles: 20
  patience: 3

self_play:
  games_per_round: 30
  simulations: 400
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  exploration_dropoff: 8
  rounds: 10
