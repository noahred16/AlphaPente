# Example model config — first trained Pente model.
#
# Values below reproduce today's hardcoded defaults (TrainCommon.hpp,
# SelfPlayConfig, NNModel.hpp) exactly, so training behaves the same either
# way until you actually change something.
#
# What's live: `bootstrap:`, `model:`, `train:`, and `bootstrap_training:` —
# all read by training/model.py, which drives apps/Train.cpp's -B/-l/-W/-v/
# -f/-G/-m/-c/-r/-a flags. `self_play:` and `promotion_arena:` aren't wired to
# anything yet (no self-play harness exists; promotion-arena confirmation was
# intentionally dropped for this first pass — see conversation history).
#
# Changing channels/res_blocks on a model that already has a trained
# best_model.pt will refuse to load it (checkArchitectureMatches in
# NNModel.hpp) rather than silently training/evaluating at the wrong width —
# weight shapes are fixed at save time, so that always means starting a new
# model, not resizing an existing one.

name: pente_v1

# Which bootstrap dataset this model starts from — see
# training/bootstrap/configs/<name>.yaml. Shared across any model config that
# references it; generated once, reused by all of them.
bootstrap: pente_base

model:
  channels: 128
  res_blocks: 8

# Self-play data generation once a trained model exists.
self_play:
  games_per_iteration: 200
  simulations: 1600
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  exploration_dropoff: 8
  buffer_size: 62500       # FIFO cap on stored positions (unique, pre-augmentation)
  min_buffer_size: 625     # below this, train is skipped for the iteration

train:
  batch_size: 256
  learning_rate: 0.01
  weight_decay: 0.0001
  value_loss_weight: 1.0
  value_alpha: 0.2          # target = alpha*z + (1-alpha)*rootQ
  val_fraction: 0.05        # held out from training, used for the promotion gate
  val_gate_tolerance: 1.02  # candidate must not regress val loss by more than this factor
  min_grad_steps: 200

# Controls the outer loop training/model.py runs over `train` (one cycle =
# one `train -b` call). Read by training/model.py, not apps/Train.cpp itself.
# No promotion-arena confirmation yet — just early-stops on val loss, like
# bootstrap_train.sh did minus the arena step (see conversation history).
bootstrap_training:
  max_cycles: 20
  patience: 3    # stop after this many cycles with no val-loss improvement

promotion_arena:
  games: 30
  simulations: 400
  win_rate_threshold: 0.45  # candidate must reach this share of decisive games vs previous best
