<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 x 5 Pente</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>5 x 5 Pente</h1>

<div id="toolbar">
  <button id="reset">Reset</button>
  <button id="undo">Undo</button>
  <button id="settings-btn" aria-label="Settings" title="Settings">⚙</button>
</div>

<div id="settings-dialog">
<div id="settings-content">
  <h2>Settings</h2>

  <div class="settings-group">
    <div class="settings-label">Mode</div>
    <label><input type="radio" name="mode" value="pvp"> Player vs Player</label>
    <label><input type="radio" name="mode" value="ai" checked> Player vs AI</label>
  </div>

  <div class="settings-group">
    <div class="settings-label">Effort</div>
    <label><input type="radio" name="effort" value="low"> <span>Low</span></label>
    <label><input type="radio" name="effort" value="medium"> <span>Medium</span></label>
    <label><input type="radio" name="effort" value="high" checked> <span>High</span></label>
  </div>

  <button id="settings-close">Close</button>
</div>
</div>

<div id="status"></div>
<div id="captures"></div>

<div id="board"></div>

<div id="top-moves-wrap">
<table id="top-moves">
  <thead>
    <tr><th>Move</th><th>Visits</th><th>Avg Value</th><th>PUCT</th><th>Status</th></tr>
  </thead>
  <tbody></tbody>
</table>
</div>

<script src="wasm/pente.js"></script>
<script src="js/app.js"></script>
</body>
</html>
