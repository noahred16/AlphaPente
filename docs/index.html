<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">4 x 4 Pente</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1 id="page-heading">4 x 4 Pente</h1>

<div id="loading">Loading engine…</div>

<div id="app" class="hidden">

<div id="toolbar">
  <button id="reset">Reset</button>
  <button id="undo">Undo</button>
  <button id="settings-btn" aria-label="Settings" title="Settings">⚙</button>
</div>

<div id="settings-dialog">
<div id="settings-content">
  <h2>Settings</h2>

  <div class="settings-group">
    <div class="settings-label">Board Size</div>
    <select id="board-size">
      <option value="4" selected>4 x 4 (solved)</option>
      <option value="5">5 x 5</option>
      <option value="7">7 x 7</option>
      <option value="9">9 x 9</option>
    </select>
  </div>

  <div class="settings-group">
    <div class="settings-label">Mode</div>
    <label><input type="radio" name="mode" value="pvp"> Player vs Player</label>
    <label><input type="radio" name="mode" value="ai" checked> Player vs AI</label>
  </div>

  <div class="settings-group">
    <div class="settings-label">Effort</div>
    <label><input type="radio" name="effort" value="low"> <span>Low</span></label>
    <label><input type="radio" name="effort" value="medium"> <span>Medium</span></label>
    <label><input type="radio" name="effort" value="high" checked> <span>High</span></label>
    <label><input type="radio" name="effort" value="ultra"> <span>Ultra</span></label>
  </div>

  <button id="settings-close">Close</button>
</div>
</div>

<div id="status"></div>
<div id="captures"></div>

<div id="board"></div>

<div id="top-moves-wrap">
<table id="top-moves">
  <thead></thead>
  <tbody></tbody>
</table>
</div>

</div>

<!-- Cache-busting query param: bump on every change to wasm/pente.js or
     js/app.js, since browsers cache these aggressively and there's no build
     step to do this automatically. Without it, a returning visitor can keep
     running stale JS/WASM indefinitely even after a fix is deployed. -->
<script src="wasm/pente.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
